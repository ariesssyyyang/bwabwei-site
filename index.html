<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bwa Bwei</title>
<style>
  :root {
    --bg: #f6ecd9; --surface: #efdfc2; --ink: #2a1410;
    --muted: #6b5246; --accent: #8e1c16; --gold: #e0a92e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.7 -apple-system, "PingFang TC", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh; display: grid; place-items: center;
  }
  main { max-width: 560px; padding: 48px 24px; text-align: center; }
  .kicker {
    letter-spacing: 1px; font-size: 13px;
    font-weight: 700; color: var(--accent); margin: 0 0 8px;
  }
  h1 { font-size: 40px; margin: 0 0 6px; }
  .en { color: var(--muted); }
  p.lead { color: var(--muted); font-size: 18px; margin: 0 0 28px; }
  .links { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  a.btn {
    display: inline-block; text-decoration: none; font-weight: 600;
    color: var(--ink); background: var(--surface);
    border: 2px solid var(--gold);
    padding: 10px 22px; border-radius: 999px;
  }
</style>
</head>
<body>
<main>
  <p class="kicker">Bwa Bwei</p>
  <h1>擲筊，問個平安。</h1>
  <p class="lead">
    心裡有事拿不定主意？默念問題，搖晃手機，筊給上天決定。<br>
    <span class="en">Can’t make up your mind? Ask your question, shake your phone, and let heaven decide.</span>
  </p>
  <div class="links">
    <a class="btn" href="support.html">技術支援 Support</a>
    <a class="btn" href="privacy.html">隱私權政策 Privacy</a>
  </div>
</main>
</body>
</html>
